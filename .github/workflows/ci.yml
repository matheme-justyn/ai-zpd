name: CI - Scaffolding Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validation:
    name: Comprehensive Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install toml

      - name: Run validation scripts
        run: |
          # Scope: this workflow validates only what ai-zpd owns after the
          # three-repo split (ADR 0014) — the install/run mechanism and the
          # config and version files that drive it. Checks for skills, agent
          # roles and SDD content were removed when that content moved to
          # ai-skill-web; those layers validate their own content.
          echo "Running ai-zpd mechanism-layer validation..."
          echo ""

          VALIDATION_PASSED=true

          # 1. Script syntax validation
          echo "================================================"
          echo "  1. Script Syntax Validation"
          echo "================================================"

          # Globbed rather than listed: a hardcoded list silently degrades to a
          # non-failing "not found" warning when a script is deleted, so it
          # stops covering anything. The glob always covers what is actually
          # there, and needs no edit when scripts are added or removed.
          if [ ! -d ".scaffolding/scripts" ]; then
            echo "✗ .scaffolding/scripts/ not found"
            VALIDATION_PASSED=false
          else
            SCRIPT_COUNT=0
            for script in .scaffolding/scripts/*.sh; do
              [ -e "$script" ] || continue
              SCRIPT_COUNT=$((SCRIPT_COUNT + 1))
              if bash -n "$script" 2>/dev/null; then
                echo "✓ $script"
              else
                echo "✗ $script (syntax error)"
                bash -n "$script" 2>&1 | sed 's/^/    /'
                VALIDATION_PASSED=false
              fi
            done

            if [ "$SCRIPT_COUNT" -eq 0 ]; then
              echo "✗ no shell scripts found under .scaffolding/scripts/"
              VALIDATION_PASSED=false
            else
              echo ""
              echo "  $SCRIPT_COUNT script(s) syntax-checked"
            fi

            # bash -n proves a script parses, not that what it invokes exists.
            # Deleting install-hooks.sh left three live call sites in
            # init-project.sh, and with `set -e` that aborts the primary install
            # path — a break no syntax check can see. This catches the next one.
            DANGLING=0
            for script in .scaffolding/scripts/*.sh; do
              [ -e "$script" ] || continue
              grep -oE '(\./)?\.scaffolding/scripts/[A-Za-z0-9_.-]+\.sh' "$script" 2>/dev/null \
                | sed 's|^\./||' | sort -u | while read -r called; do
                  [ "$called" = "${script#./}" ] && continue
                  [ -f "$called" ] || echo "$script|$called"
                done
            done > /tmp/dangling.txt

            while IFS='|' read -r caller called; do
              [ -z "$caller" ] && continue
              echo "✗ $caller references $called, which does not exist"
              DANGLING=$((DANGLING + 1))
            done < /tmp/dangling.txt

            if [ "$DANGLING" -gt 0 ]; then
              echo "✗ $DANGLING dangling script reference(s)"
              VALIDATION_PASSED=false
            else
              echo "  no dangling script references"
            fi
          fi

          echo ""

          # 2. Configuration validation
          echo "================================================"
          echo "  2. Configuration Validation"
          echo "================================================"

          # ai-zpd owns config.toml (TOML). ai-scheme's .scheme/config.yml is
          # not validated here and must not be — neither layer reads or parses
          # the other's config file (ADR 0015).
          if [ -f "config.toml.example" ]; then
            if python3 -c "import toml; toml.load(open('config.toml.example'))" 2>/dev/null; then
              echo "✓ config.toml.example is valid TOML"
            else
              echo "✗ config.toml.example has syntax errors"
              python3 -c "import toml; toml.load(open('config.toml.example'))" 2>&1 | sed 's/^/    /'
              VALIDATION_PASSED=false
            fi
          else
            echo "✗ config.toml.example not found"
            VALIDATION_PASSED=false
          fi

          echo ""

          # 3. Documentation validation
          echo "================================================"
          echo "  3. Documentation Validation"
          echo "================================================"

          # Only files whose absence means this repo is broken. Documents whose
          # owning layer is still undecided are deliberately not listed — see
          # issue #8. Requiring a document this layer may not own is what made
          # this workflow permanently red after the split.
          REQUIRED_DOCS=(
            "README.md"
            "CHANGELOG.md"
            "AGENTS.md"
            ".scaffolding/CHANGELOG.md"
            ".scaffolding/VERSION"
          )

          MISSING_DOCS=0
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [ -f "$doc" ]; then
              echo "✓ $doc"
            else
              echo "✗ $doc missing"
              MISSING_DOCS=$((MISSING_DOCS + 1))
            fi
          done

          if [ $MISSING_DOCS -gt 0 ]; then
            echo "✗ $MISSING_DOCS required document(s) missing"
            VALIDATION_PASSED=false
          fi

          echo ""

          # 4. Version format validation
          echo "================================================"
          echo "  4. Version Validation"
          echo "================================================"

          # .scaffolding/VERSION is the single source of truth for the template
          # version (ADR 0016). It is what init-project.sh reads to produce a
          # consuming project's .template-version, and it ships inside
          # .scaffolding/, so it cannot be derived from anything at the root.
          # The root VERSION file this used to be compared against was removed:
          # in a consuming project the root VERSION holds that project's own
          # version (init-project.sh seeds it at 0.1.0), so the two files only
          # ever coincided inside this repo, where the root copy had no reader.
          TEMPLATE_VERSION=$(cat .scaffolding/VERSION)
          if printf '%s' "$TEMPLATE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "✓ Template version is valid SemVer: $TEMPLATE_VERSION"
          else
            echo "✗ .scaffolding/VERSION is not valid SemVer: '$TEMPLATE_VERSION'"
            VALIDATION_PASSED=false
          fi

          if [ -f "VERSION" ]; then
            echo "✗ a root VERSION file is present"
            echo "    This repo has a single version source, .scaffolding/VERSION (ADR 0016)."
            echo "    A root VERSION reintroduces the drift the collapse removed."
            VALIDATION_PASSED=false
          fi

          # The README version badges are maintained by hand since the generator
          # that used to write them was removed (ADR 0018). Checking them here is
          # what makes a stale badge fail rather than sit unnoticed — the previous
          # badges were two patch versions behind, and a third was a whole major
          # behind, precisely because nothing checked.
          for readme in README.md README.zh-TW.md; do
            BADGE_VERSION=$(grep -o 'badge/version-[^-]*-blue' "$readme" | head -1 | sed 's|badge/version-||; s|-blue||')
            if [ -z "$BADGE_VERSION" ]; then
              echo "✗ $readme has no version badge"
              VALIDATION_PASSED=false
            elif [ "$BADGE_VERSION" = "$TEMPLATE_VERSION" ]; then
              echo "✓ $readme badge matches: $BADGE_VERSION"
            else
              echo "✗ $readme badge is $BADGE_VERSION, expected $TEMPLATE_VERSION"
              VALIDATION_PASSED=false
            fi
          done

          echo ""

          # 5. Relative link validation
          echo "================================================"
          echo "  5. Relative Link Validation"
          echo "================================================"

          # The split moved content out but left references behind, and a
          # reference to a document this layer no longer owns is what kept
          # CI red for weeks (#7). Ownership is now recorded per document in
          # .scaffolding/docs/OWNERSHIP.md; this check is what keeps the two
          # from drifting apart again.
          BROKEN_LINKS=0
          while IFS= read -r md; do
            # ](target) where target is relative: no scheme, not an anchor
            grep -o '](\.\{0,2\}/[^)#]*)' "$md" 2>/dev/null | sed 's/^](//; s/)$//' | while read -r target; do
              echo "$md|$target"
            done
          # CHANGELOGs are excluded: they record what was true at each
          # release, including paths that have since moved. Rewriting them
          # to satisfy a link check would falsify the record.
          done < <(find . -name '*.md' -not -path './.git/*' -not -name 'CHANGELOG.md') > /tmp/links.txt

          while IFS='|' read -r md target; do
            [ -z "$target" ] && continue
            resolved="$(dirname "$md")/$target"
            if [ ! -e "$resolved" ]; then
              echo "✗ $md → $target"
              BROKEN_LINKS=$((BROKEN_LINKS + 1))
            fi
          done < /tmp/links.txt

          if [ "$BROKEN_LINKS" -gt 0 ]; then
            echo "✗ $BROKEN_LINKS broken relative link(s)"
            VALIDATION_PASSED=false
          else
            echo "✓ all relative links resolve ($(wc -l < /tmp/links.txt | tr -d ' ') checked)"
          fi

          echo ""

          # Final summary
          echo "================================================"
          echo "  Validation Summary"
          echo "================================================"
          echo ""

          if [ "$VALIDATION_PASSED" = true ]; then
            echo "✅ All validations passed"
            exit 0
          else
            echo "❌ Some validations failed"
            echo ""
            echo "Please review the errors above and fix them."
            exit 1
          fi
